name: Test pull request event
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          # Provide explicit commit-range to avoid needing real PR base/head SHAs
          commit-range: "HEAD~1..HEAD"
          sign: "false"

      - name: Assert receipt_count is a non-negative integer
        env:
          RECEIPT_COUNT: ${{ steps.action.outputs.receipt_count }}
        run: |
          echo "receipt_count: $RECEIPT_COUNT"
          if ! echo "$RECEIPT_COUNT" | grep -qE '^[0-9]+$'; then
            echo "FAIL: receipt_count is not a non-negative integer: '$RECEIPT_COUNT'"
            exit 1
          fi
          echo "PASS: receipt_count=$RECEIPT_COUNT"

      - name: Assert receipts_overflow is false or empty
        env:
          OVERFLOW: ${{ steps.action.outputs.receipts_overflow }}
        run: |
          echo "receipts_overflow: $OVERFLOW"
          if [ "$OVERFLOW" = "true" ]; then
            echo "FAIL: receipts_overflow should not be true for a small commit range"
            exit 1
          fi
          echo "PASS: receipts_overflow=$OVERFLOW"

      - name: Assert signed_receipt_count is 0 when sign=false
        env:
          SIGNED_COUNT: ${{ steps.action.outputs.signed_receipt_count }}
        run: |
          echo "signed_receipt_count: $SIGNED_COUNT"
          if [ "$SIGNED_COUNT" != "0" ] && [ -n "$SIGNED_COUNT" ]; then
            echo "FAIL: expected signed_receipt_count=0 when sign=false, got '$SIGNED_COUNT'"
            exit 1
          fi
          echo "PASS"
