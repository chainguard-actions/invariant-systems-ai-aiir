# Quality checks — type checking, markdown lint, link checking, spelling,
# Dockerfile lint, YAML validation, and SPDX header enforcement.
#
# These checks complement ci.yml (tests) and security.yml (SAST/deps).
# They validate documentation integrity, type safety, and packaging hygiene.
name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Static type checking (mypy) ────────────────────────────────────
  # Validates the py.typed + Typing::Typed classifier claims.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Install mypy
        run: pip install --require-hashes --no-deps -r .github/requirements/typecheck.txt
      - name: Run mypy
        run: mypy aiir/

  # ── Markdown lint ──────────────────────────────────────────────────
  # Validates formatting consistency across all .md files.
  markdown-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd  # v23.2.0
        with:
          globs: "**/*.md"

  # ── Link checking ──────────────────────────────────────────────────
  # Catches dead URLs in documentation.
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - name: Check links with lychee
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411  # v2.8.0
        with:
          args: >-
            --no-progress
            --exclude 'https://pypi.org/project/aiir'
            --exclude 'localhost'
            --exclude '127.0.0.1'
            --exclude 'https://docs.gitlab.com'
            --exclude 'https://modeltrademarkguidelines.org'
            --exclude 'https://invariantsystems.io/blog/'
            --exclude 'https://scorecard.dev/'
            --exclude 'https://sigstore.dev/'
            --exclude 'https://www.contributor-covenant.org'
            --exclude 'https://in-toto.io'
            --accept 200,202,429,504
            --timeout 30
            --max-retries 3
            '**/*.md'
          fail: true

  # ── Spelling check ─────────────────────────────────────────────────
  # Catches typos in docs and source code comments.
  spelling:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - name: Install typos
        uses: crate-ci/typos@37bb98842b0d8c4ffebdb75301a13db0267cef89  # v1.47.2
        with:
          config: .typos.toml

  # ── Dockerfile lint (Hadolint) ─────────────────────────────────────
  hadolint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - name: Run Hadolint
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5  # v3.3.0
        with:
          dockerfile: Dockerfile

  # ── YAML validation ────────────────────────────────────────────────
  # Validates CI templates and examples are syntactically correct YAML.
  yaml-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Install yamllint
        run: pip install --require-hashes --no-deps -r .github/requirements/yamllint.txt
      - name: Lint YAML templates and examples
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: disable}}" \
            templates/ examples/

  # ── SPDX header enforcement ────────────────────────────────────────
  # Ensures every .py file has an SPDX-License-Identifier.
  spdx-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - name: Verify SPDX headers
        run: |
          MISSING=0
          for f in $(find aiir/ tests/ scripts/ -name '*.py' -not -path '*__pycache__*' -not -name '__init__.py'); do
            if ! grep -q 'SPDX-License-Identifier' "$f"; then
              echo "::error file=$f::Missing SPDX-License-Identifier header"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            echo "::error::$MISSING files missing SPDX headers"
            exit 1
          fi
          echo "✅ All .py files have SPDX headers"

  # ── Summary gate ───────────────────────────────────────────────────
  quality-ok:
    if: always()
    needs: [typecheck, markdown-lint, link-check, spelling, hadolint, yaml-lint, spdx-check]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify all quality jobs passed
        env:
          RESULT_TYPECHECK: ${{ needs.typecheck.result }}
          RESULT_MARKDOWN_LINT: ${{ needs.markdown-lint.result }}
          RESULT_LINK_CHECK: ${{ needs.link-check.result }}
          RESULT_SPELLING: ${{ needs.spelling.result }}
          RESULT_HADOLINT: ${{ needs.hadolint.result }}
          RESULT_YAML_LINT: ${{ needs.yaml-lint.result }}
          RESULT_SPDX_CHECK: ${{ needs.spdx-check.result }}
        run: |
          echo "typecheck:     $RESULT_TYPECHECK"
          echo "markdown-lint: $RESULT_MARKDOWN_LINT"
          echo "link-check:    $RESULT_LINK_CHECK"
          echo "spelling:      $RESULT_SPELLING"
          echo "hadolint:      $RESULT_HADOLINT"
          echo "yaml-lint:     $RESULT_YAML_LINT"
          echo "spdx-check:    $RESULT_SPDX_CHECK"
          if [[ "$RESULT_TYPECHECK" != "success" || \
                "$RESULT_MARKDOWN_LINT" != "success" || \
                "$RESULT_LINK_CHECK" != "success" || \
                "$RESULT_SPELLING" != "success" || \
                "$RESULT_HADOLINT" != "success" || \
                "$RESULT_YAML_LINT" != "success" || \
                "$RESULT_SPDX_CHECK" != "success" ]]; then
            echo "::error::Quality gate failed"
            exit 1
          fi
          echo "✅ All quality checks passed"
