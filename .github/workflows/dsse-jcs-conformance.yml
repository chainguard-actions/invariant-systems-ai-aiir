# SPDX-License-Identifier: Apache-2.0
name: DSSE JCS Conformance

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  conformance:
    name: DSSE ↔ JCS conformance & verifier parity
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'

      - name: Install Go + jq
        run: |
          sudo apt-get update
          sudo apt-get install -y golang-go jq
          go version
          jq --version

      - name: Install cosign
        run: bash scripts/install-cosign.sh

      - name: Install Python verifier dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes --no-deps -r .github/requirements/sigstore.txt

      - name: Validate vector inventory
        run: |
          if [ ! -d test-vectors ]; then
            echo '::error::test-vectors directory is required for conformance checks'
            exit 1
          fi
          COUNT=$(find test-vectors -type f -name '*.dsse' | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo '::error::No .dsse vectors found under test-vectors/'
            exit 1
          fi
          echo "Found $COUNT DSSE vectors"

      - name: Run DSSE↔JCS suite
        run: python conformance/harness.py

      - name: Upload mismatch JSON (always)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dsse-jcs-mismatches
          path: conformance/mismatches.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload human-readable report (always)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dsse-jcs-report
          path: conformance/report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload canonicalized payloads (always)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dsse-jcs-canonical
          path: conformance/canonical
          if-no-files-found: warn
          retention-days: 14
