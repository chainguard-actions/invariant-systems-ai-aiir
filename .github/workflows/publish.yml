# Publish to PyPI when a version tag is pushed.
#
# Single workflow handles the full pipeline:
#   1. Verify CI tests passed on the tagged commit (gate)
#   2. Verify tag matches __version__
#   3. Create GitHub Release (with auto-generated notes)
#   4. Build wheel + sdist
#   5. Publish to PyPI via OIDC Trusted Publisher
#   6. Verify PyPI has the version (retries 6×)
#   7. Build & push Docker image to GHCR
#
# NOTE: This is a single workflow instead of release→publish chaining
# because GitHub Actions won't trigger workflows from events created
# by the default GITHUB_TOKEN (to prevent infinite loops).
name: Publish

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      sidecar_target:
        description: Manual sidecar target to run
        required: false
        default: vscode
        type: choice
        options:
          - vscode
          - npm
      release_tag:
        description: Release tag for manual sidecars (for example v1.6.0)
        required: false
        type: string

concurrency:
  group: publish-${{ github.ref_name }}
  # Never cancel a running publish — half-published state is worse than waiting
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── Gate: verify CI tests passed on this commit ────────────────────
  ci-gate:
    if: github.event_name == 'push'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Verify tag is reachable from main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Reject tags that do not descend from main — a tag on a side branch
          # bypasses the branch-protection gate and must not publish.
          COMMIT="${GITHUB_SHA}"
          MAIN_SHA=$(gh api "repos/${GH_REPO}/git/ref/heads/main" \
            --jq '.object.sha' 2>/dev/null || echo "")
          if [ -z "$MAIN_SHA" ]; then
            echo "::error::Could not resolve main branch SHA — aborting publish"
            exit 1
          fi
          # GitHub's compare/{base}...{head} reports the status of HEAD relative
          # to BASE. With base=COMMIT and head=main: if the tagged COMMIT is an
          # ancestor of main, main is "ahead"; "identical" means the tag IS main.
          # Any other status — "behind" (the tag is ahead of / descends from
          # main, e.g. a side-branch tag), "diverged", or "unknown" — means the
          # tag is not on main's history and must NOT publish.
          COMPARISON=$(gh api "repos/${GH_REPO}/compare/${COMMIT}...${MAIN_SHA}" \
            --jq '.status' 2>/dev/null || echo "unknown")
          if [ "$COMPARISON" != "ahead" ] && [ "$COMPARISON" != "identical" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on main (comparison=$COMPARISON). Aborting publish."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} verified on main (comparison=$COMPARISON)"

      - name: Wait for required CI checks to pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          COMMIT="${GITHUB_SHA}"
          echo "Checking CI status for commit ${COMMIT:0:12}..."

          # Poll for up to 10 minutes — CI runs in parallel from the
          # tag push (ci.yml triggers on version tags).
          for i in $(seq 1 60); do
            # Check for required rollup gates: ci-ok, quality-ok, security-ok.
            # These three gates aggregate ALL sub-checks in their respective
            # workflows.  Also include individual test matrix jobs so we can
            # surface pending state before rollup gates appear.
            #
            # Dedup by name (keep latest started_at) so cancelled runs from
            # prior pushes don't shadow fresh runs from the tag push.
            # per_page=100 is required: the check-runs API returns only the
            # first 30 by default, and a commit that triggered CI twice (e.g. a
            # squash-merge to main plus the release tag) can have 40+ runs,
            # pushing ci-ok/quality-ok/security-ok onto page 2 — which made the
            # gate time out despite all checks being green.
            CHECKS=$(gh api "repos/${GH_REPO}/commits/${COMMIT}/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name | test("^test \\(|^ci-ok$|^quality-ok$|^security-ok$|^CodeQL$"; "i"))] | group_by(.name) | [.[] | sort_by(.started_at) | last] | {total: length, success: [.[] | select(.conclusion == "success")] | length, pending: [.[] | select(.status != "completed")] | length, cancelled: [.[] | select(.conclusion == "cancelled")] | length, names: [.[].name]}' \
              2>/dev/null || echo '{"total":0,"success":0,"pending":0,"cancelled":0,"names":[]}')

            TOTAL=$(echo "$CHECKS" | python3 -c "import sys,json; print(json.load(sys.stdin).get('total',0))")
            SUCCESS=$(echo "$CHECKS" | python3 -c "import sys,json; print(json.load(sys.stdin).get('success',0))")
            PENDING=$(echo "$CHECKS" | python3 -c "import sys,json; print(json.load(sys.stdin).get('pending',0))")
            CANCELLED=$(echo "$CHECKS" | python3 -c "import sys,json; print(json.load(sys.stdin).get('cancelled',0))")

            echo "  Attempt $i/60: total=$TOTAL success=$SUCCESS pending=$PENDING cancelled=$CANCELLED"

            if [ "$CANCELLED" -gt 0 ]; then
              echo "  $CANCELLED cancelled run(s) ignored (superseded by re-runs)"
            fi

            # Hard-require the three named rollup checks to be present and green.
            # Without this, a missing check (e.g. codeql not run) would pass the gate.
            HAS_CI_OK=$(echo "$CHECKS" | python3 -c "import sys,json; d=json.load(sys.stdin); print('1' if 'ci-ok' in d.get('names',[]) else '0')")
            HAS_QUALITY=$(echo "$CHECKS" | python3 -c "import sys,json; d=json.load(sys.stdin); print('1' if 'quality-ok' in d.get('names',[]) else '0')")
            HAS_SECURITY=$(echo "$CHECKS" | python3 -c "import sys,json; d=json.load(sys.stdin); print('1' if 'security-ok' in d.get('names',[]) else '0')")

            ACTIVE=$((TOTAL - CANCELLED))
            if [ "$ACTIVE" -gt 0 ] && [ "$SUCCESS" -eq "$ACTIVE" ] && [ "$PENDING" -eq 0 ] && \
               [ "$HAS_CI_OK" = "1" ] && [ "$HAS_QUALITY" = "1" ] && [ "$HAS_SECURITY" = "1" ]; then
              echo "CI gate passed: $SUCCESS/$ACTIVE checks successful (ci-ok, quality-ok, security-ok all present)"
              exit 0
            fi

            # If any check hard-failed (not pending, not success, not cancelled), fail fast
            FAILED=$(echo "$CHECKS" | python3 -c "
          import sys,json
          d = json.load(sys.stdin)
          f = d.get('total',0) - d.get('success',0) - d.get('pending',0) - d.get('cancelled',0)
          print(f)
          ")
            if [ "$FAILED" -gt 0 ]; then
              echo "::error::CI gate failed: $FAILED check(s) failed on ${COMMIT:0:12}"
              echo "See: https://github.com/${GH_REPO}/commit/${COMMIT}"
              exit 1
            fi

            sleep 10
          done

          echo "::error::CI gate timed out — tests did not complete within 10 minutes for ${COMMIT:0:12}"
          echo "Push a new tag after CI passes, or re-run this workflow."
          exit 1

  # ── Gate: verify tag = code version ────────────────────────────────
  preflight:
    if: github.event_name == 'push'
    needs: ci-gate
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python3 -c "
          import re
          text = open('aiir/__init__.py').read()
          m = re.search(r'__version__\s*=\s*[\"\\x27]([^\"\\x27]+)', text)
          print(m.group(1))
          ")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag ($TAG) ≠ aiir/__init__.py ($PKG). Aborting."
            exit 1
          fi
          echo "✅ Tag matches: $TAG"

  # ── Step 1: Create GitHub Release ──────────────────────────────────
  release:
    if: github.event_name == 'push'
    needs: preflight
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create GitHub Release
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          # Build a structured header that appears above --generate-notes content.
          # The .github/release.yml template categorizes PRs by label.
          HEADER=$(cat <<'HEADER_END'
          ## Install

          ```bash
          pip install aiir==$VERSION_PLACEHOLDER
          ```

          **GitHub Action** — `uses: invariant-systems-ai/aiir@v1`
          **Docker** — `docker run ghcr.io/invariant-systems-ai/aiir:$VERSION_PLACEHOLDER`
          **GitLab CI/CD** — [Catalog component](https://gitlab.com/explore/catalog/invariant-systems/aiir)
          HEADER_END
          )
          HEADER="${HEADER//\$VERSION_PLACEHOLDER/$VERSION}"
          # Dedent (the heredoc is indented for readability in the workflow)
          HEADER=$(echo "$HEADER" | sed 's/^          //')

          # Idempotent: if release exists, promote it to latest (un-prerelease).
          # This handles the case where a release was manually created as
          # pre-release or auto-detected as one — we always want tagged
          # semver releases to be full releases for Marketplace eligibility.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "ℹ️  Release $TAG already exists — ensuring it is marked as latest"
            gh release edit "$TAG" --prerelease=false --latest
          else
            gh release create "$TAG" \
              --title "AIIR $TAG" \
              --notes-start-tag "$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo '')" \
              --generate-notes \
              --verify-tag \
              --latest
            echo "✅ Release $TAG created"

            # Prepend the install header above the auto-generated notes
            EXISTING=$(gh release view "$TAG" --json body --jq .body)
            printf '%s\n\n%s' "$HEADER" "$EXISTING" | gh release edit "$TAG" --notes-file -
            echo "✅ Release notes enriched with install header"
          fi

  # ── Step 1b: Attach SBOM to release ────────────────────────────────
  attach-dist:
    if: github.event_name == 'push'
    needs: [release, build]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: write # Upload wheel + sdist to GitHub Release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Upload wheel and sdist to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          artifacts=(dist/*.whl dist/*.tar.gz)
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "::error::No built distribution artifacts found in dist/"
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${artifacts[@]}" \
            --clobber --repo "$GH_REPO"
          echo "✅ Distribution artifacts attached to release $GITHUB_REF_NAME"

  attach-sbom:
    if: github.event_name == 'push'
    needs: [release, build]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: write # Upload SBOM asset to GitHub Release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom/
      - name: Upload SBOM to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -f sbom/aiir-sbom.cdx.json ]; then
            gh release upload "$GITHUB_REF_NAME" sbom/aiir-sbom.cdx.json \
              --clobber --repo "$GH_REPO"
            echo "✅ SBOM attached to release $GITHUB_REF_NAME"
          else
            echo "::error::SBOM file not found — release is incomplete"
            exit 1
          fi

  # ── Step 2: Build sdist + wheel ────────────────────────────────────
  build:
    if: github.event_name == 'push'
    needs: preflight
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Sync version strings
        run: python scripts/sync-version.py --check
      - name: Build
        run: |
          pip install --require-hashes --no-deps -r .github/requirements/build.txt
          python -m build
      - name: Generate SBOM (CycloneDX)
        run: |
          pip install --require-hashes --no-deps -r .github/requirements/cyclonedx.txt
          # Generate SBOM from the built wheel — covers the package + all
          # declared dependencies (which is zero for aiir, but proves it).
          # NOTE: --schema-version was removed in cyclonedx-bom v7; the tool
          # now emits the latest CycloneDX schema version automatically.
          mkdir -p sbom
          cyclonedx-py environment \
            --output-format json \
            --output-file sbom/aiir-sbom.cdx.json
          echo "✅ SBOM generated: $(wc -c < sbom/aiir-sbom.cdx.json) bytes"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/

  # ── Step 3: Publish to PyPI ────────────────────────────────────────
  publish:
    if: github.event_name == 'push'
    needs: build
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # Required for OIDC Trusted Publisher
      attestations: write # Required for SLSA provenance attestation
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          # Idempotent: if a tag is force-pushed after the version was already
          # published, skip rather than fail.  PyPI is immutable — same version
          # + same content is a no-op; different content is rejected regardless.
          skip-existing: true
          # PEP 740: Generate and upload digital attestations (SLSA provenance
          # + PyPI Publish predicates) for every wheel and sdist.  Requires
          # Trusted Publishing (OIDC) — no static API tokens or key management.
          # Attestations are signed with short-lived OIDC identities and can be
          # verified via PyPI's Integrity API.
          attestations: true
        # No API token needed — uses OIDC via Trusted Publisher config on PyPI

  # ── Step 3b: SLSA Provenance Attestation ───────────────────────────
  attest:
    if: github.event_name == 'push'
    needs: publish
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Generate SLSA provenance attestation (wheel)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: "dist/*.whl"
      - name: Generate SLSA provenance attestation (sdist)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: "dist/*.tar.gz"

  # ── Step 3c: Upload provenance to release (Scorecard Signed-Releases) ──
  upload-provenance:
    if: github.event_name == 'push'
    needs: [attest, release]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write # Upload release assets
      id-token: write # Verify attestations
      attestations: read # Read attestation bundles
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Download and attach provenance bundles
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p provenance
          for artifact in dist/*; do
            FNAME=$(basename "$artifact")
            DIGEST="sha256:$(sha256sum "$artifact" | cut -d' ' -f1)"
            echo "📦 Fetching provenance for ${FNAME} (${DIGEST})..."

            # Download attestation bundle from GitHub Attestations API
            gh api "repos/${GH_REPO}/attestations/${DIGEST}" \
              --jq '.attestations[0].bundle' > "provenance/${FNAME}.intoto.jsonl" 2>/dev/null || true

            if [ -s "provenance/${FNAME}.intoto.jsonl" ]; then
              gh release upload "$GITHUB_REF_NAME" "provenance/${FNAME}.intoto.jsonl" \
                --clobber --repo "$GH_REPO"
              echo "  ✅ Provenance uploaded for ${FNAME}"
            else
              echo "::error::No attestation bundle found for ${FNAME}"
              exit 1
            fi
          done

          UPLOADED=$(ls -1 provenance/*.intoto.jsonl 2>/dev/null | wc -l)
          echo ""
          echo "📊 Provenance upload: ${UPLOADED} bundle(s) attached to release"

  # ── Step 4: Verify PyPI ────────────────────────────────────────────
  verify:
    if: github.event_name == 'push'
    needs: [publish, attach-dist, attach-sbom, attest, upload-provenance]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install cosign verifier
        run: bash scripts/install-cosign.sh

      - name: Verify GitHub release assets are complete
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ASSETS=$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GH_REPO" \
            --json assets \
            --jq '.assets[].name')

          echo "📦 Release assets:"
          printf '  %s\n' $ASSETS

          printf '%s\n' "$ASSETS" | grep -Eq '^aiir-[0-9].*\.whl$' || {
            echo "::error::Missing wheel asset on GitHub release"
            exit 1
          }
          printf '%s\n' "$ASSETS" | grep -Eq '^aiir-[0-9].*\.tar\.gz$' || {
            echo "::error::Missing sdist asset on GitHub release"
            exit 1
          }
          printf '%s\n' "$ASSETS" | grep -Fxq 'aiir-sbom.cdx.json' || {
            echo "::error::Missing SBOM asset on GitHub release"
            exit 1
          }

          PROVENANCE_COUNT=$(printf '%s\n' "$ASSETS" | grep -Ec '^aiir-[0-9].*\.(whl|tar\.gz)\.intoto\.jsonl$')
          if [ "$PROVENANCE_COUNT" -lt 2 ]; then
            echo "::error::Expected 2 provenance bundles on GitHub release, found $PROVENANCE_COUNT"
            exit 1
          fi

          echo "✅ GitHub release assets are complete"

      - name: Wait for PyPI index propagation
        run: sleep 30
      - name: Verify package on PyPI
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for i in 1 2 3 4 5 6; do
            VERSION=$(python3 -c "
          import json, urllib.request
          try:
              data = json.load(urllib.request.urlopen('https://pypi.org/pypi/aiir/json'))
              print(data['info']['version'])
          except Exception:
              print('unknown')
          ")
            if [ "$VERSION" = "$TAG" ]; then
              echo "✅ PyPI verified: aiir==$TAG"
              exit 0
            fi
            echo "⏳ Attempt $i/6: PyPI has $VERSION, waiting for $TAG..."
            sleep 30
          done
          echo "::error::PyPI did not update to $TAG within 3 minutes"
          exit 1

      - name: Enforce PEP 740 provenance policy
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "🔍 Enforcing PEP 740 provenance policy for aiir==$TAG..."
          python3 scripts/enforce_pypi_provenance.py "$TAG" \
            --project aiir \
            --repository invariant-systems-ai/aiir \
            --workflow publish.yml \
            --environment pypi \
            --out-dir /tmp/aiir-pypi-provenance

          # Run the cryptographic verifier from a clean virtualenv.
          # The ubuntu-latest system Python can produce false-negative Rekor
          # checkpoint errors for the same release artifacts.
          VERIFY_ROOT="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_ROOT"' EXIT
          python3 -m venv "$VERIFY_ROOT/venv"
          "$VERIFY_ROOT/venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-input \
            "pypi-attestations==0.0.29"

          FILES=$(python3 -c "
          import json, urllib.request
          data = json.load(urllib.request.urlopen('https://pypi.org/pypi/aiir/${TAG}/json'))
          for url_info in data.get('urls', []):
              print(url_info['filename'])
          ")

          for FILE in $FILES; do
            echo "  Cryptographically verifying: $FILE"
            "$VERIFY_ROOT/venv/bin/pypi-attestations" verify pypi \
              --repository https://github.com/invariant-systems-ai/aiir \
              "pypi:${FILE}"
          done
          echo "✅ All release artifacts passed PEP 740 policy + crypto verification"

  # ── Step 4a: Publish release attestation surface ──────────────────
  release-attest:
    if: github.event_name == 'push'
    needs: [verify, release]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom/
      - name: Emit release attestation surface
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p provenance provenance/release-assets
          python3 scripts/emit_release_attest.py \
            --repo "$GH_REPO" \
            --tag "$GITHUB_REF_NAME" \
            --project aiir \
            --dist-dir dist \
            --sbom-path sbom/aiir-sbom.cdx.json \
            --json-out provenance/release-attest.json \
            --md-out provenance/release-attest.md \
            --asset-dir provenance/release-assets \
            --release-body-out provenance/release-body.md
      - name: Attach release attestation assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            provenance/release-attest.json \
            provenance/release-attest.md \
            provenance/release-assets/* \
            --clobber --repo "$GH_REPO"
          gh release edit "$GITHUB_REF_NAME" \
            --notes-file provenance/release-body.md \
            --repo "$GH_REPO"
          echo "✅ Release attestation surface attached and release notes updated"

  # Offline Rekor sidecars are published by offline-rekor-release.yml so
  # transparency assets stay isolated from the main release/npm path.

  # ── Step 4b: Publish JS SDK to npm ───────────────────────────────────
  publish-npm:
    if: github.event_name == 'push'
    needs: [preflight, verify, release-attest]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment: automation-secrets
    permissions:
      contents: read
      id-token: write # Required for npm Trusted Publishing via GitHub OIDC
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Verify npm trusted publishing toolchain
        run: |
          node --version
          npm --version
          python3 - <<'PY'
          import subprocess

          npm_version = subprocess.check_output(["npm", "--version"], text=True).strip()
          parsed = tuple(int(part) for part in npm_version.split(".")[:3])
          if parsed < (11, 5, 1):
            raise SystemExit(f"npm {npm_version} is too old for trusted publishing")
          print(f"Trusted publishing toolchain OK: npm {npm_version}")
          PY
      - name: Sync JS SDK version to release tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          cd sdks/js
          # Update package.json version to match the release tag.
          # Uses node to preserve JSON formatting.
          node -e "
            const pkg = require('./package.json');
            pkg.version = '${TAG}';
            require('fs').writeFileSync(
              'package.json',
              JSON.stringify(pkg, null, 2) + '\n'
            );
          "
          echo "✅ JS SDK version set to ${TAG}"
          cat package.json | grep '"version"'
      - name: Publish to npm
        working-directory: sdks/js
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "@invariantsystems/aiir@${VERSION}" version >/dev/null 2>&1; then
            echo "ℹ️  @invariantsystems/aiir@${VERSION} is already on npm — skipping"
            exit 0
          fi
          # Use npm Trusted Publishing via GitHub OIDC; no long-lived token.
          # publishConfig.access = "public" is set in package.json,
          # but we pass --access public as belt-and-suspenders.
          npm publish --access public
          echo "✅ @invariantsystems/aiir@${GITHUB_REF_NAME#v} published to npm"

  # ── Manual sidecar publish: npm only ───────────────────────────────
  publish-npm-sidecar:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.sidecar_target == 'npm'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment: automation-secrets
    permissions:
      contents: read
      id-token: write # Required for npm Trusted Publishing via GitHub OIDC
    steps:
      - name: Validate requested release tag
        env:
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          TAG="${INPUT_RELEASE_TAG}"
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::release_tag must look like v1.2.3"
            exit 1
          fi
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.inputs.release_tag }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Verify npm trusted publishing toolchain
        run: |
          node --version
          npm --version
          python3 - <<'PY'
          import subprocess

          npm_version = subprocess.check_output(["npm", "--version"], text=True).strip()
          parsed = tuple(int(part) for part in npm_version.split(".")[:3])
          if parsed < (11, 5, 1):
            raise SystemExit(f"npm {npm_version} is too old for trusted publishing")
          print(f"Trusted publishing toolchain OK: npm {npm_version}")
          PY
      - name: Verify tag matches package version
        env:
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          TAG="${INPUT_RELEASE_TAG}"
          PKG=$(python3 -c "
          import re
          text = open('aiir/__init__.py').read()
          m = re.search(r'__version__\s*=\s*[\"\\x27]([^\"\\x27]+)', text)
          print(m.group(1))
          ")
          if [ "${TAG#v}" != "$PKG" ]; then
            echo "::error::Tag ($TAG) ≠ aiir/__init__.py ($PKG). Aborting."
            exit 1
          fi
          echo "Tag matches: $TAG"
      - name: Sync JS SDK version to release tag
        env:
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          TAG="${INPUT_RELEASE_TAG#v}"
          cd sdks/js
          node -e "
            const pkg = require('./package.json');
            pkg.version = '${TAG}';
            require('fs').writeFileSync(
              'package.json',
              JSON.stringify(pkg, null, 2) + '\n'
            );
          "
          echo "JS SDK version set to ${TAG}"
          cat package.json | grep '"version"'
      - name: Publish to npm
        env:
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        working-directory: sdks/js
        run: |
          VERSION="${INPUT_RELEASE_TAG#v}"
          if npm view "@invariantsystems/aiir@${VERSION}" version >/dev/null 2>&1; then
            echo "@invariantsystems/aiir@${VERSION} is already on npm — skipping"
            exit 0
          fi
          npm publish --access public
          echo "@invariantsystems/aiir@${VERSION} published to npm"

  # ── Step 5: Build & publish VS Code extension ─────────────────────
  publish-vscode:
    if: github.event_name == 'push'
    needs: [preflight, release]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment: automation-secrets
    permissions:
      contents: write # Upload .vsix to GitHub Release
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Read extension version from manifest
        working-directory: extensions/vscode
        run: |
          node -e "const pkg = require('./package.json'); console.log('✅ Extension version from package.json:', pkg.version)"
          grep '"version"' package.json
      - name: Install dependencies
        working-directory: extensions/vscode
        run: npm ci
      - name: Compile and test
        working-directory: extensions/vscode
        run: |
          npm run compile
          npm test
      - name: Regenerate marketplace docs
        working-directory: extensions/vscode
        run: npm run marketplace:sync
      - name: Package VSIX
        working-directory: extensions/vscode
        run: npx @vscode/vsce package --no-git-tag-version
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix
          path: extensions/vscode/*.vsix
      - name: Attach VSIX to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VSIX=$(ls extensions/vscode/*.vsix)
          gh release upload "$GITHUB_REF_NAME" "$VSIX" \
            --clobber --repo "$GH_REPO"
          echo "✅ VSIX attached to release $GITHUB_REF_NAME"
      - name: Publish to VS Code Marketplace
        working-directory: extensions/vscode
        env:
          # VSCE_PAT: Personal Access Token for the 'invariant-systems'
          # publisher on the VS Code Marketplace.
          # Scope: Marketplace → Manage (publish/unpublish).
          # Create at https://dev.azure.com → User Settings → PATs.
          # Rotate every 365 days.
          # Store on the GitHub Actions environment `automation-secrets`
          # so PAT-backed automation stays in one delivery plane.
          # Support the historical Azure DevOps PAT aliases so older secret
          # names keep working while the workflow standardizes on VSCE_PAT.
          VSCE_PAT: ${{ secrets.VSCE_PAT || secrets.AZURE_DEV_PAT || secrets.AZURE_DEVOPS_PAT || secrets.ADO_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT not set — VSIX built and attached to release but not published to Marketplace"
            echo "::warning::Set VSCE_PAT or a supported Azure DevOps PAT alias to enable Marketplace publishing"
            exit 0
          fi
          npx @vscode/vsce publish --no-git-tag-version --packagePath *.vsix
          echo "✅ AIIR v${GITHUB_REF_NAME#v} published to VS Code Marketplace"
      - name: Publish to Open VSX Registry
        working-directory: extensions/vscode
        env:
          # OVSX_PAT: Access token for the Open VSX Registry (open-vsx.org).
          # Create at https://open-vsx.org/user-settings/tokens.
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::notice::OVSX_PAT not set — skipping Open VSX publish"
            exit 0
          fi
          npx ovsx publish *.vsix --pat "$OVSX_PAT"
          echo "✅ AIIR v${GITHUB_REF_NAME#v} published to Open VSX"

  # ── Manual sidecar publish: VS Code extension only ─────────────────
  publish-vscode-sidecar:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.sidecar_target == 'vscode'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment: automation-secrets
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Read extension version from manifest
        working-directory: extensions/vscode
        run: |
          node -e "const pkg = require('./package.json'); console.log('✅ Extension version from package.json:', pkg.version)"
          grep '"version"' package.json
      - name: Install dependencies
        working-directory: extensions/vscode
        run: npm ci
      - name: Compile and test
        working-directory: extensions/vscode
        run: |
          npm run compile
          npm test
      - name: Regenerate marketplace docs
        working-directory: extensions/vscode
        run: npm run marketplace:sync
      - name: Package VSIX
        working-directory: extensions/vscode
        run: npx @vscode/vsce package --no-git-tag-version
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix-sidecar
          path: extensions/vscode/*.vsix
      - name: Publish to VS Code Marketplace
        working-directory: extensions/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT || secrets.AZURE_DEV_PAT || secrets.AZURE_DEVOPS_PAT || secrets.ADO_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT not set — no supported Marketplace token alias was available to the sidecar publish job"
            exit 1
          fi
          npx @vscode/vsce publish --no-git-tag-version --packagePath *.vsix
          echo "✅ AIIR VS Code extension sidecar published to VS Code Marketplace"
      - name: Publish to Open VSX Registry
        working-directory: extensions/vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::notice::OVSX_PAT not set — skipping Open VSX publish"
            exit 0
          fi
          npx ovsx publish *.vsix --pat "$OVSX_PAT"
          echo "✅ AIIR VS Code extension sidecar published to Open VSX"

  # ── Step 6: Build & push Docker image to GHCR ──────────────────────
  docker:
    if: github.event_name == 'push'
    needs: [verify, release-attest]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          build-args: AIIR_VERSION=${{ steps.version.outputs.tag }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true

  # ── Step 7: Propagate version to website ───────────────────────────
  update-website:
    if: github.event_name == 'push'
    needs: [verify, docker, publish-npm, publish-vscode]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    environment: automation-secrets
    permissions:
      contents: read
    # Non-blocking: website has a 6-hour self-heal schedule as backup
    continue-on-error: true
    steps:
      - name: Trigger website version bump
        # WEBSITE_DISPATCH_TOKEN: fine-grained PAT scoped to:
        #   - repo: invariant-systems-ai/invariantsystems.io
        #   - permissions: contents:read + metadata:read (dispatch only)
        # Rotate every 90 days.  If absent, the website self-heals on
        # its 6-hour cron schedule — this step is an accelerator, not
        # a hard dependency.
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::WEBSITE_DISPATCH_TOKEN not set — website will self-heal within 6 hours"
            exit 0
          fi
          TAG="${GITHUB_REF_NAME#v}"
          gh api "repos/invariant-systems-ai/invariantsystems.io/dispatches" \
            -f event_type=version-bump \
            -f "client_payload[version]=$TAG"
          echo "✅ Dispatched version-bump ($TAG) to invariantsystems.io"
