name: Release Recovery

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to resume, e.g. vX.Y.Z"
        required: true
      source_ref:
        description: "Optional git ref for mutable downstream rebuilds such as Docker. Defaults to the release tag."
        required: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.normalize.outputs.tag }}
      version: ${{ steps.normalize.outputs.version }}
      source_ref: ${{ steps.normalize.outputs.source_ref }}
    steps:
      - name: Normalize tag input
        id: normalize
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_SOURCE_REF: ${{ github.event.inputs.source_ref }}
        run: |
          RAW="$INPUT_TAG"
          if [[ ! "$RAW" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must be semver like vX.Y.Z"
            exit 1
          fi
          if [[ "$RAW" != v* ]]; then
            RAW="v${RAW}"
          fi
          SOURCE="$INPUT_SOURCE_REF"
          if [[ -z "$SOURCE" ]]; then
            SOURCE="$RAW"
          fi
          safe_tag=$(printf '%s' "$RAW" | tr -d '\n\r')
          safe_version=$(printf '%s' "${RAW#v}" | tr -d '\n\r')
          safe_source=$(printf '%s' "$SOURCE" | tr -d '\n\r')
          echo "tag=$safe_tag" >> "$GITHUB_OUTPUT"
          echo "version=$safe_version" >> "$GITHUB_OUTPUT"
          echo "source_ref=$safe_source" >> "$GITHUB_OUTPUT"

  verify:
    needs: resolve
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - name: Install cosign verifier
        run: bash scripts/install-cosign.sh

      - name: Verify GitHub release assets are complete
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          ASSETS=$(gh release view "$TAG" \
            --repo "$GH_REPO" \
            --json assets \
            --jq '.assets[].name')

          echo "📦 Release assets:"
          printf '  %s\n' $ASSETS

          printf '%s\n' "$ASSETS" | grep -Eq '^aiir-[0-9].*\.whl$' || {
            echo "::error::Missing wheel asset on GitHub release"
            exit 1
          }
          printf '%s\n' "$ASSETS" | grep -Eq '^aiir-[0-9].*\.tar\.gz$' || {
            echo "::error::Missing sdist asset on GitHub release"
            exit 1
          }
          printf '%s\n' "$ASSETS" | grep -Fxq 'aiir-sbom.cdx.json' || {
            echo "::error::Missing SBOM asset on GitHub release"
            exit 1
          }

          PROVENANCE_COUNT=$(printf '%s\n' "$ASSETS" | grep -Ec '^aiir-[0-9].*\.(whl|tar\.gz)\.intoto\.jsonl$')
          if [ "$PROVENANCE_COUNT" -lt 2 ]; then
            echo "::error::Expected 2 provenance bundles on GitHub release, found $PROVENANCE_COUNT"
            exit 1
          fi

          echo "✅ GitHub release assets are complete"

      - name: Verify package on PyPI
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          for i in 1 2 3 4 5 6; do
            LIVE=$(python3 -c "
          import json, urllib.request
          try:
              data = json.load(urllib.request.urlopen('https://pypi.org/pypi/aiir/json'))
              print(data['info']['version'])
          except Exception:
              print('unknown')
          ")
            if [ "$LIVE" = "$VERSION" ]; then
              echo "✅ PyPI verified: aiir==$VERSION"
              exit 0
            fi
            echo "⏳ Attempt $i/6: PyPI has $LIVE, waiting for $VERSION..."
            sleep 30
          done
          echo "::error::PyPI did not update to $VERSION within 3 minutes"
          exit 1

      - name: Enforce PEP 740 provenance policy
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          echo "🔍 Enforcing PEP 740 provenance policy for aiir==$VERSION..."
          python3 scripts/enforce_pypi_provenance.py "$VERSION" \
            --project aiir \
            --repository invariant-systems-ai/aiir \
            --workflow publish.yml \
            --environment pypi \
            --out-dir /tmp/aiir-pypi-provenance

          VERIFY_ROOT="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_ROOT"' EXIT
          python3 -m venv "$VERIFY_ROOT/venv"
          "$VERIFY_ROOT/venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-input \
            "pypi-attestations==0.0.29"

          FILES=$(python3 -c "
          import json, urllib.request
          data = json.load(urllib.request.urlopen('https://pypi.org/pypi/aiir/${VERSION}/json'))
          for url_info in data.get('urls', []):
              print(url_info['filename'])
          ")

          for FILE in $FILES; do
            echo "  Cryptographically verifying: $FILE"
            "$VERIFY_ROOT/venv/bin/pypi-attestations" verify pypi \
              --repository https://github.com/invariant-systems-ai/aiir \
              "pypi:${FILE}"
          done
          echo "✅ All release artifacts passed PEP 740 policy + crypto verification"

  release-attest:
    needs: [resolve, verify]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.resolve.outputs.source_ref }}
          persist-credentials: false
      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p dist sbom
          gh release download "$TAG" \
            --repo "$GH_REPO" \
            --pattern 'aiir-*.whl' \
            --pattern 'aiir-*.tar.gz' \
            --dir dist
          gh release download "$TAG" \
            --repo "$GH_REPO" \
            --pattern 'aiir-sbom.cdx.json' \
            --dir sbom
          test -f sbom/aiir-sbom.cdx.json
      - name: Emit release attestation surface
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p provenance provenance/release-assets
          python3 scripts/emit_release_attest.py \
            --repo "$GH_REPO" \
            --tag "$TAG" \
            --project aiir \
            --dist-dir dist \
            --sbom-path sbom/aiir-sbom.cdx.json \
            --json-out provenance/release-attest.json \
            --md-out provenance/release-attest.md \
            --asset-dir provenance/release-assets \
            --release-body-out provenance/release-body.md
      - name: Attach release attestation assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$TAG" \
            provenance/release-attest.json \
            provenance/release-attest.md \
            provenance/release-assets/* \
            --clobber --repo "$GH_REPO"
          gh release edit "$TAG" \
            --notes-file provenance/release-body.md \
            --repo "$GH_REPO"
          echo "✅ Release attestation surface attached and release notes updated"

  publish-npm:
    needs: [resolve, verify, release-attest]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment: automation-secrets
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Verify JS SDK version matches tag
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          cd sdks/js
          LIVE=$(node -p "require('./package.json').version")
          if [ "$LIVE" != "$VERSION" ]; then
            echo "::error::sdks/js/package.json has $LIVE, expected $VERSION"
            exit 1
          fi
          echo "✅ JS SDK version matches $VERSION"
      - name: Publish to npm
        working-directory: sdks/js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          if npm view "@invariantsystems/aiir@${VERSION}" version >/dev/null 2>&1; then
            echo "ℹ️  @invariantsystems/aiir@${VERSION} is already on npm — skipping"
            exit 0
          fi
          npm publish --access public
          echo "✅ @invariantsystems/aiir@${VERSION} published to npm"

  docker:
    needs: [resolve, verify, release-attest]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.resolve.outputs.source_ref }}
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          build-args: AIIR_VERSION=${{ needs.resolve.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.resolve.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.resolve.outputs.version }}"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true

  update-website:
    needs: [resolve, verify, docker, publish-npm]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    environment: automation-secrets
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - name: Trigger website version bump
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::WEBSITE_DISPATCH_TOKEN not set — website will self-heal within 6 hours"
            exit 0
          fi
          gh api "repos/invariant-systems-ai/invariantsystems.io/dispatches" \
            -f event_type=version-bump \
            -f "client_payload[version]=$VERSION"
          echo "✅ Dispatched version-bump ($VERSION) to invariantsystems.io"
