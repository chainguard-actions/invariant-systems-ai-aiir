# SPDX-License-Identifier: Apache-2.0
name: Offline Rekor Release Assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to process, e.g. vX.Y.Z"
        required: true

permissions:
  contents: read
  attestations: read

jobs:
  publish-offline-rekor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # required to upload release assets via gh release upload
    env:
      TAG_NAME: ${{ github.event.release.tag_name || github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Validate tag input
        run: |
          if [[ -z "$TAG_NAME" ]]; then
            echo "::error::Release tag could not be resolved"
            exit 1
          fi
          echo "🔎 Preparing offline Rekor assets for $TAG_NAME"

      - name: Wait for release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p dist offline provenance

          for i in $(seq 1 60); do
            ASSETS=$(gh release view "$TAG_NAME" \
              --repo "$GH_REPO" \
              --json assets \
              --jq '.assets[].name' 2>/dev/null || true)

            WHEEL=$(printf '%s\n' "$ASSETS" | grep -E '^aiir-[0-9].*\.whl$' | head -1 || true)
            SDIST=$(printf '%s\n' "$ASSETS" | grep -E '^aiir-[0-9].*\.tar\.gz$' | head -1 || true)

            if [[ -n "$WHEEL" && -n "$SDIST" ]]; then
              echo "✅ Found release artifacts: $WHEEL and $SDIST"
              break
            fi

            if [[ "$i" -eq 60 ]]; then
              echo "::error::Release artifacts did not appear on $TAG_NAME within 10 minutes"
              exit 1
            fi

            echo "⏳ Waiting for wheel and sdist assets on $TAG_NAME..."
            sleep 10
          done

          gh release download "$TAG_NAME" \
            --repo "$GH_REPO" \
            --pattern 'aiir-*.whl' \
            --pattern 'aiir-*.tar.gz' \
            --dir dist

      - name: Emit offline Rekor bundles
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          artifacts=(dist/*.whl dist/*.tar.gz)
          if [[ "${#artifacts[@]}" -eq 0 ]]; then
            echo "::error::No distribution artifacts found for offline Rekor bundle generation"
            exit 1
          fi

          for artifact in "${artifacts[@]}"; do
            name="$(basename "$artifact")"
            digest="$(sha256sum "$artifact" | awk '{print $1}')"
            bundle_path="provenance/${name}.sigstore.json"

            for i in $(seq 1 30); do
              if gh api "repos/${GH_REPO}/attestations/sha256:${digest}" \
                --jq '.attestations[0].bundle' > "$bundle_path" 2>/dev/null; then
                if [[ -s "$bundle_path" ]] && ! grep -qx 'null' "$bundle_path"; then
                  break
                fi
              fi

              rm -f "$bundle_path"
              if [[ "$i" -eq 30 ]]; then
                echo "::error::GitHub attestation bundle for $name did not appear in time"
                exit 1
              fi

              echo "⏳ Waiting for GitHub attestation bundle for $name..."
              sleep 10
            done

            python3 scripts/emit_offline_rekor_bundle.py \
              --artifact "$artifact" \
              --bundle "$bundle_path" \
              --output "offline/${name}.rekor-bundle.json"
          done

          wheel_name="$(basename "$(ls dist/*.whl | head -1)")"

          {
            echo "# Verify AIIR Release Bundles Offline"
            echo
            echo "This release ships per-artifact Rekor bundles derived from the same GitHub attestation bundles used in the public release evidence surface."
            echo
            echo "## Included bundles"
            echo
            for bundle in offline/*.rekor-bundle.json; do
              echo "- $(basename "$bundle")"
            done
            echo
            echo "## Rekor-only verification"
            echo
            echo '```bash'
            echo "python3 scripts/check_rekor_bundle.py \\"
            echo "  --artifact ${wheel_name} \\"
            echo "  --bundle ${wheel_name}.rekor-bundle.json"
            echo '```'
            echo
            echo "Run the same command for the sdist by swapping the artifact and bundle filenames."
            echo
            echo "## Full witness verification"
            echo
            echo "AIIR does not currently publish a production trust root or witnessed checkpoint in this workflow."
            echo "If you maintain a witness quorum externally, attach aiir-trust.json and witnessed-checkpoint.txt and then run:"
            echo
            echo '```bash'
            echo "aiir --artifact ${wheel_name} \\"
            echo "  --rekor-bundle ${wheel_name}.rekor-bundle.json \\"
            echo "  --trust-root aiir-trust.json \\"
            echo "  --witnessed-checkpoint witnessed-checkpoint.txt \\"
            echo "  --require-witnesses release"
            echo '```'
          } > offline/VERIFY-OFFLINE.md

      - name: Upload offline Rekor assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$TAG_NAME" \
            offline/*.rekor-bundle.json \
            offline/VERIFY-OFFLINE.md \
            --clobber \
            --repo "$GH_REPO"
          echo "✅ Offline Rekor bundle assets attached to release $TAG_NAME"
