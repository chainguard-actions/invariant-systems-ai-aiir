# Contribution intake hardening for pull requests.
#
# Safe for forks: uses pull_request_target and workflow metadata only.
# It never checks out or executes code from the PR branch.
name: Contribution Assessment

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]
    branches: [main]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_run:
    workflows: ["Tests", "Quality", "Security"]
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  assess:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.event == 'pull_request'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Assess contribution intake risk
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          run_url="https://github.com/$REPO/actions/runs/$GITHUB_RUN_ID"
          marker='<!-- aiir-contribution-assessment -->'
          sensitive_path_regex='^(aiir/|\.github/workflows/|\.github/rulesets/|action\.yml$|scripts/|schemas/|Dockerfile$|pyproject\.toml$|mcp-manifest\.json$)'
          workflow_path_regex='^\.github/workflows/'
          dependency_path_regex='^(\.github/requirements/|pyproject\.toml$|noxfile\.py$)'
          release_path_regex='^(\.github/workflows/(publish|release-smoke|release-recovery|sync|update-major-tag)\.yml$|action\.yml$|Dockerfile$|scripts/(emit_release_attest|enforce_pypi_provenance|verify-pypi-provenance|verify-release-evidence)\.py$)'
          tests_path_regex='^tests/'
          docs_path_regex='^(docs/|.*\.md$)'

          set_status() {
            local state="$1"
            local description="$2"
            gh api \
              --method POST \
              "repos/$REPO/statuses/$head_sha" \
              -f state="$state" \
              -f context="contribution-assessment" \
              -f description="$description" \
              -f target_url="$run_url" \
              >/dev/null
          }

          case "$EVENT_NAME" in
            pull_request_target|pull_request_review)
              pr_number="$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")"
              ;;
            workflow_run)
              pr_number="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME"
              exit 0
              ;;
          esac

          if [[ -z "$pr_number" ]]; then
            echo "No pull request associated with this event"
            exit 0
          fi

          pr_json="$(gh api "repos/$REPO/pulls/$pr_number")"
          pr_state="$(jq -r '.state' <<<"$pr_json")"
          base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
          pr_url="$(jq -r '.html_url' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pr_json")"
          author_login="$(jq -r '.user.login' <<<"$pr_json")"
          author_assoc="$(jq -r '.author_association' <<<"$pr_json")"

          if [[ "$pr_state" != "open" || "$base_ref" != "main" ]]; then
            echo "PR is not eligible for contribution assessment"
            exit 0
          fi

          author_perm="$(gh api "repos/$REPO/collaborators/$author_login/permission" --jq '.permission' 2>/dev/null || echo "none")"

          is_bot="false"
          if [[ "$author_login" =~ \[bot\]$ ]]; then
            is_bot="true"
          fi

          files_json="$(gh api --paginate "repos/$REPO/pulls/$pr_number/files?per_page=100")"
          commits_json="$(gh api --paginate "repos/$REPO/pulls/$pr_number/commits?per_page=100")"
          reviews_json="$(gh api "repos/$REPO/pulls/$pr_number/reviews?per_page=100")"
          pr_view_json="$(gh pr view "$pr_number" --repo "$REPO" --json statusCheckRollup)"

          file_count="$(jq 'length' <<<"$files_json")"
          additions="$(jq '[.[].additions] | add // 0' <<<"$files_json")"
          deletions="$(jq '[.[].deletions] | add // 0' <<<"$files_json")"
          delta=$((additions + deletions))
          commit_count="$(jq 'length' <<<"$commits_json")"

          sensitive_count="$(jq -r --arg pat "$sensitive_path_regex" 'map(select(.filename | test($pat))) | length' <<<"$files_json")"
          workflow_count="$(jq -r --arg pat "$workflow_path_regex" 'map(select(.filename | test($pat))) | length' <<<"$files_json")"
          dependency_count="$(jq -r --arg pat "$dependency_path_regex" 'map(select(.filename | test($pat))) | length' <<<"$files_json")"
          release_count="$(jq -r --arg pat "$release_path_regex" 'map(select(.filename | test($pat))) | length' <<<"$files_json")"
          tests_count="$(jq -r --arg pat "$tests_path_regex" 'map(select(.filename | test($pat))) | length' <<<"$files_json")"
          docs_count="$(jq -r --arg pat "$docs_path_regex" 'map(select(.filename | test($pat))) | length' <<<"$files_json")"

          if [[ "$is_bot" == "true" ]]; then
            dco_missing=0
            dco_note='skipped for bot-authored PR'
          else
            dco_missing="$(jq '[.[] | select((.commit.message | test("(^|\\n)Signed-off-by:[^\\n]+<[^\\n]+>"; "im")) | not)] | length' <<<"$commits_json")"
            if [[ "$dco_missing" -eq 0 ]]; then
              dco_note='pass'
            else
              dco_note="fail (${dco_missing} commit(s) missing sign-off)"
            fi
          fi

          trusted_approver=''
          approver_logins="$(jq -r '
            [.[] | select(.state != "COMMENTED")] |
            group_by(.user.login) |
            map(sort_by(.submitted_at) | last) |
            .[] |
            select(.state == "APPROVED") |
            .user.login
          ' <<<"$reviews_json" | sort -u)"

          if [[ -n "$approver_logins" ]]; then
            while IFS= read -r reviewer; do
              [[ -z "$reviewer" ]] && continue
              reviewer_perm="$(gh api "repos/$REPO/collaborators/$reviewer/permission" --jq '.permission' 2>/dev/null || echo "none")"
              case "$reviewer_perm" in
                admin|maintain|write)
                  trusted_approver="$reviewer"
                  break
                  ;;
              esac
            done <<< "$approver_logins"
          fi

          trusted_approval='false'
          if [[ -n "$trusted_approver" ]]; then
            trusted_approval='true'
          fi

          ci_gate="$(jq -r 'first(.statusCheckRollup[]? | select(.name == "ci-ok" and .status == "COMPLETED") | .conclusion) // "PENDING"' <<<"$pr_view_json")"
          quality_gate="$(jq -r 'first(.statusCheckRollup[]? | select(.name == "quality-ok" and .status == "COMPLETED") | .conclusion) // "PENDING"' <<<"$pr_view_json")"
          security_gate="$(jq -r 'first(.statusCheckRollup[]? | select(.name == "security-ok" and .status == "COMPLETED") | .conclusion) // "PENDING"' <<<"$pr_view_json")"

          risk='low'
          if [[ "$dco_missing" -gt 0 ]]; then
            risk='high'
          elif [[ "$head_repo" != "$REPO" && ( "$sensitive_count" -gt 0 || "$workflow_count" -gt 0 || "$dependency_count" -gt 0 || "$release_count" -gt 0 ) ]]; then
            risk='high'
          elif [[ "$sensitive_count" -gt 0 || "$head_repo" != "$REPO" || "$workflow_count" -gt 0 || "$dependency_count" -gt 0 || "$release_count" -gt 0 || "$file_count" -gt 20 || "$delta" -gt 800 ]]; then
            risk='medium'
          fi

          requires_human_review='false'
          if [[ "$head_repo" != "$REPO" && ( "$sensitive_count" -gt 0 || "$workflow_count" -gt 0 || "$dependency_count" -gt 0 || "$release_count" -gt 0 ) ]]; then
            requires_human_review='true'
          fi

          status_state='success'
          status_desc='Assessment passed'
          hardening_result='PASS'
          hardening_note='No extra intake hardening conditions triggered.'

          if [[ "$dco_missing" -gt 0 ]]; then
            status_state='failure'
            status_desc='Blocked: missing DCO sign-off'
            hardening_result='BLOCKED'
            hardening_note='One or more human-authored commits are missing Signed-off-by trailers.'
          elif [[ "$requires_human_review" == 'true' && "$trusted_approval" != 'true' ]]; then
            status_state='pending'
            status_desc='Waiting for maintainer approval'
            hardening_result='WAITING'
            hardening_note='External contribution touches sensitive paths and needs trusted maintainer approval.'
          elif [[ "$requires_human_review" == 'true' ]]; then
            status_state='success'
            status_desc='Sensitive external change approved'
            hardening_result='PASS'
            hardening_note="Trusted maintainer approval recorded from @$trusted_approver."
          fi

          sensitive_examples="$(jq -r --arg pat "$sensitive_path_regex" '
            map(select(.filename | test($pat))) |
            .[:5] |
            map("- `" + .filename + "`") |
            .[]?
          ' <<<"$files_json")"

          if [[ -z "$sensitive_examples" ]]; then
            sensitive_examples='- none'
          fi

          source_kind='same-repository branch'
          if [[ "$head_repo" != "$REPO" ]]; then
            source_kind='external fork'
          fi

          next_step='Continue with the normal CI, quality, and security gates.'
          if [[ "$dco_missing" -gt 0 ]]; then
            next_step='Add Signed-off-by trailers to each human-authored commit with git commit --amend -s or git rebase --signoff.'
          elif [[ "$requires_human_review" == 'true' && "$trusted_approval" != 'true' ]]; then
            next_step='A maintainer with write access should review and approve before merge because this external PR changes sensitive paths.'
          elif [[ "$requires_human_review" == 'true' ]]; then
            next_step='Trusted maintainer approval is present; keep the normal merge gates green.'
          fi

          set_status "$status_state" "$status_desc"

          summary=$(cat <<EOF
          ${marker}
          **Contribution Assessment**

          - Risk tier: **${risk^^}**
          - Source: ${source_kind} (${head_repo}) by @${author_login} (association: ${author_assoc}, permission: ${author_perm})
          - Scope: ${file_count} file(s), +${additions} / -${deletions}, ${commit_count} commit(s)
          - DCO: ${dco_note}
          - Sensitive paths: ${sensitive_count}
          - Workflow changes: ${workflow_count}
          - Dependency surface changes: ${dependency_count}
          - Release surface changes: ${release_count}
          - Tests touched: ${tests_count}
          - Docs touched: ${docs_count}
          - Required gates snapshot: ci-ok=${ci_gate}, quality-ok=${quality_gate}, security-ok=${security_gate}

          **Hardening result**

          - ${hardening_result}: ${hardening_note}
          - Next step: ${next_step}

          **Sensitive files**

          ${sensitive_examples}
          EOF
          )

          existing_comment="$(gh api "repos/$REPO/issues/$pr_number/comments?per_page=100" \
            --jq "[.[] | select(.body | contains(\"$marker\"))] | first | .id // empty")"

          if [[ -n "$existing_comment" ]]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$existing_comment" -f body="$summary" >/dev/null
          else
            gh api --method POST "repos/$REPO/issues/$pr_number/comments" -f body="$summary" >/dev/null
          fi

          echo "Contribution assessment complete for $pr_url"